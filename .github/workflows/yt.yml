name: Daily YouTube to Telegram Video Uploader

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run_video_uploader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache FFmpeg
      uses: actions/cache@v3
      with:
        path: ~/.ffmpeg
        key: ${{ runner.os }}-ffmpeg
        restore-keys: |
          ${{ runner.os }}-ffmpeg

    - name: Install FFmpeg (if not cached)
      run: |
        if [ ! -f ~/.ffmpeg/ffmpeg ]; then
          mkdir -p ~/.ffmpeg
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C ~/.ffmpeg --strip-components=1
        fi
        echo "FFMPEG_HOME=$HOME/.ffmpeg" >> $GITHUB_ENV
        echo "$HOME/.ffmpeg" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client requests yt-dlp packaging google-genai pydantic

    - name: Run YouTube to Telegram script
      env:
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        AI_TOKEN: ${{ secrets.AI_TOKEN }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        GOOGLE: ${{ secrets.GOOGLE }}
        GOOGLE_AI_TOKEN: ${{ secrets.GOOGLE_AI_TOKEN }}
      run: python yt.py
