name: Run Bot

on:
  schedule:
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment: env
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser

    - name: Run main.py
      run: python main.py

    - name: Check for changes in tweet_ids.json
      id: git-check
      run: |
        git diff --exit-code --quiet tweet_ids.json || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add tweet_ids.json
        git commit -m "Update tweet_ids.json"
        git pull --no-rebase
        git push
