name: Youtube mainy

on:
  schedule:
    - cron: '0,20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment: env
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installed google-genai based on your code imports
        pip install google-genai
        pip install yp-dl
        pip install pydantic

    - name: Run mainy.py
      env:
        GOOGLE_AI_TOKEN: ${{ secrets.GOOGLE_AI_TOKEN }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        FEED_URL: ${{ secrets.FEED_URL }}
        RSS_URL: ${{ secrets.RSS_URL }}
      run: python mainy.py

    - name: Check for changes in seen_feedy.json
      id: git-check
      run: |
        # Updated filename to match 'seen_feedy.json' from your python script
        git diff --exit-code --quiet seen_feedy.json || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add seen_feedy.json
        git commit -m "Update seen_feedy.json"
        git pull --no-rebase
        git push