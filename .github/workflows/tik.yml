name: Daily tiktok to Telegram Video Uploader

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run_video_uploader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # - name: Install FFmpeg
    #   run: |
    #     sudo apt update
    #     sudo apt install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yt-dlp

    - name: Run tiktok to Telegram script
      run: python tt.py

    - name: Upload downloaded videos as artifact
      uses: actions/upload-artifact@v4
      with:
          name: tiktoks
          path: |
            *.mp4

    - name: Commit history file
      run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_tiktoks.json
          git commit -m "Update download history" || echo "No changes to commit"
          git push || echo "No changes to push"
