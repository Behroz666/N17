name: Daily tiktok to Telegram Video Uploader

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run_video_uploader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install FFmpeg
      run: |
        sudo apt update
        sudo apt install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yt-dlp

    - name: Run tiktok to Telegram script
      run: python tt.py

    - name: Check for changes in downloaded_tiktoks.json
      id: git-check
      run: |
        git diff --exit-code --quiet downloaded_tiktoks.json || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add downloaded_tiktoks.json
        git commit -m "Update downloaded_tiktoks.json"
        git pull --no-rebase
        git push
