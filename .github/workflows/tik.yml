name: Daily tiktok to Telegram Video Uploader

on:
  schedule:
    - cron: '0 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_video_uploader:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache FFmpeg
      uses: actions/cache@v3
      with:
        path: ~/.ffmpeg
        key: ${{ runner.os }}-ffmpeg
        restore-keys: |
          ${{ runner.os }}-ffmpeg

    - name: Install FFmpeg (if not cached)
      run: |
        if [ ! -f ~/.ffmpeg/ffmpeg ]; then
          mkdir -p ~/.ffmpeg
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C ~/.ffmpeg --strip-components=1
        fi
        echo "FFMPEG_HOME=$HOME/.ffmpeg" >> $GITHUB_ENV
        echo "$HOME/.ffmpeg" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yt-dlp bs4 cloudscraper google-genai pydantic

    - name: Run tiktok to Telegram script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        AI_TOKEN: ${{ secrets.AI_TOKEN }}
        GOOGLE_AI_TOKEN: ${{ secrets.GOOGLE_AI_TOKEN }}
      run: python tt.py

    - name: Check for changes in downloaded_tiktoks.json
      id: git-check
      run: |
        git diff --exit-code --quiet downloaded_tiktoks.json || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add downloaded_tiktoks.json
        git commit -m "Update downloaded_tiktoks.json"
        git pull --no-rebase
        git push
