name: Run Gold Script

on:
  schedule:
    - cron: '0 8,12,15,18,21 * * *'
  workflow_dispatch:  # Allows manual triggering of the workflow

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai humanize

      - name: Run gold.py
        env:
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GOOGLE_AI_TOKEN: ${{ secrets.GOOGLE_AI_TOKEN }}
        run: python gold.py

      - name: Check for changes in seen_articles.json
        id: git-check
        run: |
          git diff --exit-code --quiet seen_articles.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_articles.json
          git commit -m "Update seen_articles.json"
          git pull --no-rebase
          git push
